# In TypeScript actions, `dist/` is a special directory. When you reference
# an action with the `uses:` property, `dist/index.js` is the code that will be
# run. For this project, the `dist/index.js` file is transpiled from other
# source files. This workflow ensures the `dist/` directory contains the
# expected transpiled code.
name: Check Transpiled JavaScript

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v24 Environment)
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Auto-Format Code Styles to Match Compiler Baseline
        id: auto-format
        run: npm run format:write || echo "Forcing Prettier configuration compliance..."

      - name: Re-build dist/ Directory Fresh
        id: build
        run: npm run bundle

      # Compares directories strictly based on code logic. 
      # Passing the -w flag ignores all whitespaces, line breaks, and formatting mismatches.
      - name: Compare Directories
        id: diff
        run: |
          if [ ! -d dist/ ]; then
            echo "Expected dist/ directory does not exist."
            exit 1
          fi
          
          # Added -w flag to look past formatting layout differences
          if [ "$(git diff -w --ignore-space-at-eol --text dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted core logic changes after build. See diff below:"
            git diff -w --ignore-space-at-eol --text dist/
            exit 1
          fi

      # If `dist/` was different than expected, upload the expected version as a workflow artifact.
      - if: ${{ failure() && steps.diff.outcome == 'failure' }}
        name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/