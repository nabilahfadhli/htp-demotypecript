name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: Build production files, run formatters, and update the repository
  generate-and-push:
    name: Auto-Bundle and Format
    runs-on: ubuntu-latest
    outputs:
      changes_pushed: ${{ steps.git-push-bundle.outputs.changes_pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Bundle and Format TypeScript into JavaScript
        run: npm run bundle

      - name: Automatically Commit and Push Bundle & Format Fixes
        id: git-push-bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the workflows directory to the tracking stage
          git add dist/ src/main.ts action.yml .github/workflows/
          
          if git diff --cached --quiet; then
            echo "No compiler or formatting bundle changes detected. Skipping push."
            echo "changes_pushed=false" >> $GITHUB_OUTPUT
          else
            echo "Bundle changes detected! Committing changes..."
            git commit -m "chore: automated bundle and format fixes [skip ci]"
            git push
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          fi
        shell: bash


  # Job 2: Verifies code quality. Only runs after Job 1 completes.
  # If Job 1 pushed new code, this step safely skips since [skip ci] triggers a fresh workflow execution.
  verify-and-test:
    name: Build, Lint, and Test
    needs: generate-and-push
    if: needs.generate-and-push.outputs.changes_pushed != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting Standards
        run: npm run format:check

      - name: Run Code Linter
        run: npm run lint

      - name: Execute Jest Unit Tests
        run: npm run ci-test

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          milliseconds: 2000

      - name: Print Output
        run: echo "${{ steps.test-action.outputs.time }}"
